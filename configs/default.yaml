# Default experiment parameters for the sketchstream project.
# Override any of these from the command line (see scripts/run_local_experiments.py).

stream:
  duration: 120.0        # seconds of simulated traffic
  base_rate: 5000.0      # normal events / second
  n_sources: 2000        # source-IP pool size (Zipf-distributed)
  zipf: 1.2
  seed: 42
  window_size: 1.0       # seconds per window
  window_mode: tumbling  # tumbling | sliding
  slide_buckets: 3       # buckets per sliding window (sliding mode only)

sketches:
  cms_width: 2000
  cms_depth: 5
  hll_precision: 12
  hh_capacity: 200
  top_k: 10

detectors:
  adaptive:
    alpha: 0.2
    z_threshold: 4.0
    warmup: 30
    min_std: 0.05
    use_log: true
  cusum:
    k: 0.5
    h: 6.0
    warmup: 30
  fixed:
    # auto-tuned to the normal rate unless specified
    threshold: 0
