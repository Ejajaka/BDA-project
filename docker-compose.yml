# Kafka + Flink cluster for the distributed demo.
#
#   docker compose up -d
#   docker compose up -d --scale taskmanager=2     # genuine 2-TaskManager cluster
#   Flink UI:      http://localhost:8081
#   Kafka broker:  localhost:9092
#
# KRaft mode = no ZooKeeper needed. Tags are pinned; bump them if you like.

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: sketchstream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_NUM_PARTITIONS: "4"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  jobmanager:
    image: flink:1.20-scala_2.12-java17
    container_name: sketchstream-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
    depends_on:
      kafka:
        condition: service_healthy

  taskmanager:
    image: flink:1.20-scala_2.12-java17
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    deploy:
      replicas: 2
