# Kafka + Flink cluster for the distributed demo.
#
#   docker compose build
#   docker compose up -d --scale taskmanager=2
#   Flink UI:      http://localhost:8081
#   Kafka (host):  localhost:9092
#   Kafka (in-net):kafka:29092   <- used by the Flink job
#
# Flink images are built from Dockerfile.flink (adds Python + PyFlink).
# Kafka uses the official Apache image in KRaft mode (no ZooKeeper).

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: sketchstream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    image: sketchstream-flink:local
    container_name: sketchstream-jobmanager
    command: jobmanager
    ports:
      - "8082:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2

  taskmanager:
    image: sketchstream-flink:local
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    deploy:
      replicas: 2
